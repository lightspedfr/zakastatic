name: Secure Root Repository Deployment

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

jobs:
  root_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository Content
        uses: actions/checkout@v5

      - name: Create Default work.html
        run: |
          cat > work.html <<'EOF'
          <!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NSQQRMBPQM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NSQQRMBPQM');
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riverside High School | Where Leaders Rise</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f2044;
      --navy2: #1a3260;
      --gold: #b8962e;
      --gold2: #d4af50;
      --cream: #faf8f3;
      --white: #ffffff;
      --charcoal: #1c1c1c;
      --muted: #6b7280;
      --border: #e5e1d8;
    }

    html { scroll-behavior: smooth; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      overflow-x: hidden;
    }

    .util-bar {
      background: var(--navy);
      border-bottom: 2px solid var(--gold);
      padding: 7px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.6);
      gap: 20px;
    }
    .util-bar span { white-space: nowrap; }
    .util-bar a { color: rgba(255, 255, 255, 0.6); text-decoration: none; margin-left: 18px; transition: color .2s; }
    .util-bar a:hover { color: var(--gold2); }
    .util-socials { display: flex; gap: 14px; align-items: center; }
    .util-socials a { margin: 0; display: flex; align-items: center; gap: 5px; }
    .util-socials svg { width: 13px; height: 13px; fill: var(--gold); }

    nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: var(--white);
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5%;
      height: 72px;
    }

    .nav-logo {
      font-family: 'Times New Roman', 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
      list-style: none;
    }
    .nav-links a {
      display: block;
      padding: 8px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      text-decoration: none;
      border-radius: 3px;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    .nav-links a:hover { background: var(--navy); color: var(--white); }
    .nav-links .nav-enroll {
      background: var(--gold);
      color: var(--navy) !important;
      margin-left: 8px;
    }
    .nav-links .nav-enroll:hover { background: var(--gold2); }

    #home {
      height: 100vh;
      min-height: 600px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(15, 32, 68, 0.82) 0%, rgba(15, 32, 68, 0.55) 60%, rgba(15, 32, 68, 0.9) 100%),
        url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1600&q=85') center/cover no-repeat;
      animation: heroKen 20s ease-in-out infinite alternate;
    }
    .hero-content { position: relative; z-index: 2; padding: 0 5%; max-width: 900px; }
    .hero-eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold2);
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 6px 18px;
      margin-bottom: 28px;
    }
    .hero-content h1 {
      font-family: 'Times New Roman', 'Playfair Display', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 700;
      font-style: italic;
      line-height: 1.1;
      margin-bottom: 24px;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.3);
    }
    .hero-content p {
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: rgba(255, 255, 255, 0.82);
      max-width: 560px;
      margin: 0 auto 36px;
      line-height: 1.75;
      font-weight: 300;
    }
    .hero-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn-gold {
      background: var(--gold);
      color: var(--navy);
      padding: 14px 32px;
      font-weight: 900;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: background .2s, transform .15s;
      display: inline-block;
    }
    .btn-gold:hover { background: var(--gold2); transform: translateY(-2px); }
    .btn-ghost {
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 14px 32px;
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 2px;
      transition: border-color .2s, background .2s;
    }
    .btn-ghost:hover { border-color: white; background: rgba(255, 255, 255, 0.1); }
    .hero-scroll {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: bounce 2s infinite;
      text-decoration: none;
    }
    .hero-scroll svg { width: 20px; height: 20px; stroke: var(--gold); fill: none; }
    @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0) } 50% { transform: translateX(-50%) translateY(6px) } }

    .stats-overlap {
      max-width: 1200px;
      margin: -70px auto 0;
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--white);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.14);
    }
    .stat-cell {
      padding: 3.5rem 2rem;
      text-align: center;
      border-right: 1px solid var(--border);
      transition: background .3s;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-cell:hover { background: var(--cream); }
    .stat-cell h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      color: var(--navy);
      margin-bottom: 6px;
    }
    .stat-cell p {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--gold);
    }

    section { scroll-margin-top: 72px; }

    .section-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 8rem 5%;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      max-width: 60px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    .section-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      line-height: 1.1;
      color: var(--navy);
      margin-bottom: 1.5rem;
    }

    .section-sub {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 640px;
    }

    #about { background: var(--cream); }
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 6rem;
      align-items: center;
    }
    .about-img-wrap { position: relative; }
    .about-img-wrap img {
      width: 100%;
      height: 560px;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .about-badge {
      position: absolute;
      bottom: -24px;
      right: -24px;
      width: 120px;
      height: 120px;
      background: var(--navy);
      border: 3px solid var(--gold);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
    }
    .about-badge .yr { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold); font-weight: 700; line-height: 1; }
    .about-badge .est { font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); margin-top: 4px; }
    .about-text { padding-bottom: 48px; }
    .about-text p { font-size: 1rem; line-height: 1.9; color: var(--muted); margin-bottom: 1.2rem; }
    .signature-block { margin-top: 2.5rem; }
    .signature { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.6rem; color: var(--gold); }
    .sig-title { font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; font-weight: 700; }

    #academics { background: var(--white); }
    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 4rem;
    }
    .pillar {
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform .3s, box-shadow .3s, border-color .3s;
      background: var(--white);
    }
    .pillar:hover { transform: translateY(-8px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.1); border-color: var(--gold); }
    .pillar img { width: 100%; height: 240px; object-fit: cover; object-position: center; display: block; transition: transform .4s; }
    .pillar-body { padding: 2.5rem 2rem; }
    .pillar-num { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; margin-bottom: 10px; }
    .pillar-body h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: 14px; }
    .pillar-body p { font-size: 0.9rem; line-height: 1.8; color: var(--muted); }

    #athletics {
      background: var(--navy);
      color: white;
      position: relative;
      overflow: hidden;
    }
    #athletics::before {
      content: 'RAMS';
      position: absolute;
      right: -40px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Playfair Display', serif;
      font-size: 18vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      line-height: 1;
    }
    #athletics .section-heading { color: white; }
    #athletics .section-sub { color: rgba(255, 255, 255, 0.65); }
    .ath-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 5rem;
      align-items: center;
      margin-top: 4rem;
    }
    .ath-img img { width: 100%; height: 480px; object-fit: cover; object-position: center; display: block; }
    .ath-stats { display: flex; flex-direction: column; gap: 24px; }
    .ath-stat-item {
      border-left: 3px solid var(--gold);
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.04);
    }
    .ath-stat-item h3 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); margin-bottom: 4px; }
    .ath-stat-item p { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); }

    #news { background: var(--cream); }
    .news-featured {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 0;
      border: 1px solid var(--border);
      background: white;
      margin-top: 4rem;
      margin-bottom: 2rem;
    }
    .news-featured-img img { width: 100%; height: 100%; min-height: 340px; object-fit: cover; object-position: center; display: block; }
    .news-featured-body {
      padding: 3.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .news-tag { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
    .news-featured-body h3 { font-family: 'Playfair Display', serif; font-size: 1.7rem; line-height: 1.3; color: var(--navy); margin-bottom: 16px; }
    .news-featured-body p { font-size: 0.92rem; line-height: 1.8; color: var(--muted); }
    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      text-decoration: none;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 3px;
      width: fit-content;
      transition: color .2s;
    }
    .read-more:hover { color: var(--gold); }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    .news-card {
      background: white;
      border: 1px solid var(--border);
      overflow: hidden;
      transition: transform .25s, box-shadow .25s;
    }
    .news-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.09); }
    .news-card img { width: 100%; height: 180px; object-fit: cover; object-position: center; display: block; }
    .news-card-body { padding: 1.6rem; }
    .news-card-body h4 { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--navy); line-height: 1.4; margin: 8px 0 10px; }
    .news-card-body p { font-size: 0.82rem; color: var(--muted); line-height: 1.7; }
    .news-meta { font-size: 0.72rem; color: var(--muted); margin-top: 12px; }

    #events { background: var(--white); }
    .events-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 4rem;
      margin-top: 4rem;
    }
    .events-list { display: flex; flex-direction: column; gap: 0; }
    .event-row {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      transition: background .2s;
      text-decoration: none;
      color: inherit;
    }
    .event-row:first-child { border-top: 1px solid var(--border); }
    .event-row:hover { background: var(--cream); }
    .event-date-box {
      background: var(--navy);
      color: white;
      width: 80px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 10px;
      text-align: center;
    }
    .event-date-box .mo { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
    .event-date-box .dy { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; line-height: 1; }
    .event-info { padding: 20px 24px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .event-info h4 { font-size: 1rem; font-weight: 700; color: var(--navy); }
    .event-info p { font-size: 0.82rem; color: var(--muted); }
    .event-time { font-size: 0.72rem; color: var(--gold); font-weight: 700; letter-spacing: 0.06em; }
    .events-sidebar-widget {
      background: var(--navy);
      padding: 2.5rem;
      color: white;
      align-self: start;
      position: sticky;
      top: 90px;
    }
    .events-sidebar-widget h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 1rem; }
    .quick-link { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.07); font-size: 0.85rem; color: rgba(255, 255, 255, 0.75); text-decoration: none; transition: color .2s; }
    .quick-link:hover { color: var(--gold2); }
    .quick-link::before { content: '›'; font-size: 1.1rem; color: var(--gold); }

    #contact { background: var(--cream); }
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
      margin-top: 4rem;
    }
    .contact-info p { font-size: 0.95rem; line-height: 1.9; color: var(--muted); margin-bottom: 2rem; }
    .contact-detail { display: flex; flex-direction: column; gap: 16px; }
    .contact-row { display: flex; gap: 16px; align-items: flex-start; }
    .contact-icon { width: 40px; height: 40px; background: var(--navy); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .contact-icon svg { width: 18px; height: 18px; fill: var(--gold); }
    .contact-row h5 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gold); font-weight: 700; margin-bottom: 2px; }
    .contact-row p { font-size: 0.88rem; color: var(--muted); line-height: 1.6; }
    .social-row { display: flex; gap: 12px; margin-top: 2rem; }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--navy);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background .2s;
    }
    .social-btn svg { width: 15px; height: 15px; fill: var(--gold); }
    .social-btn:hover { background: var(--navy2); }
    .contact-form-side { background: white; border: 1px solid var(--border); padding: 3rem; }
    .contact-form-side h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--navy); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: var(--cream);
      font-family: 'Lato', sans-serif;
      font-size: 0.9rem;
      color: var(--charcoal);
      outline: none;
      transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { height: 110px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .submit-btn {
      width: 100%;
      background: var(--navy);
      color: white;
      padding: 14px;
      font-family: 'Lato', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: background .2s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--gold); color: var(--navy); }

    footer {
      background: #080f1f;
      border-top: 3px solid var(--gold);
      padding: 6rem 5% 3rem;
      color: rgba(255, 255, 255, 0.55);
    }
    .footer-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 4rem;
      padding-bottom: 4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .footer-brand h2 {
      font-family: 'Times New Roman', serif;
      font-size: 1.5rem;
      color: white;
      margin-bottom: 1rem;
    }
    .footer-brand p { font-size: 0.85rem; line-height: 1.8; margin-bottom: 1.5rem; }
    .footer-socials { display: flex; gap: 10px; }
    .footer-social-icon {
      width: 36px;
      height: 36px;
      border: 1px solid rgba(184, 150, 46, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s;
      text-decoration: none;
    }
    .footer-social-icon svg { width: 15px; height: 15px; fill: rgba(255, 255, 255, 0.6); transition: fill .2s; }
    .footer-social-icon:hover { background: var(--gold); border-color: var(--gold); }
    .footer-social-icon:hover svg { fill: var(--navy); }
    .footer-col h4 {
      font-family: 'Playfair Display', serif;
      color: var(--gold);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      letter-spacing: 0.05em;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col ul li a { font-size: 0.82rem; color: rgba(255, 255, 255, 0.5); text-decoration: none; transition: color .2s; display: flex; align-items: center; gap: 6px; }
    .footer-col ul li a::before { content: '›'; color: var(--gold); }
    .footer-col ul li a:hover { color: var(--gold2); }
    .footer-bottom {
      max-width: 1300px;
      margin: 3rem auto 0;
      display: flex;
      justify-content: space-between;
