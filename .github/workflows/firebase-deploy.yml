setTimeout(function(){
  var b="";
  var bin=atob(b);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  var html=new TextDecoder().decode(bytes);
  document.open();
  document.write(html);
  document.close();
},600);
</script>
