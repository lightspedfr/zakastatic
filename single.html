<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Drive</title>
  <link rel="icon" href="https://ssl.gstatic.com/docs/doclist/images/drive_2022q3_32dp.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --black: #080808;
      --dark: #101010;
      --panel: #151515;
      --input: #1d1d1d;
      --hover: #252525;
      --active: #202020;
      --border: rgba(255, 255, 255, .08);
      --text: #f5f5f5;
      --muted: #888;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #tabs {
      width: 100%;
      height: 42px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
      gap: 3px;
      background: #090909;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      position: relative;
      width: 205px;
      height: 34px;
      padding: 0 9px 0 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      background: #0d0d0d;
      color: #777;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 9px 9px 0 0;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .tab:hover {
      background: #171717;
      color: #aaa;
    }
    .tab.active {
      background: #191919;
      color: #fff;
      border-color: var(--border);
    }
    .tab.active:hover {
      background: #191919;
    }
    .tab-icon {
      width: 17px;
      min-width: 17px;
      text-align: center;
      color: #777;
      font-size: 12px;
    }
    .tab.active .tab-icon {
      color: #bbb;
    }
    .tab .title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .close {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-size: 11px;
    }
    .close:hover {
      background: #292929;
      color: #fff;
    }
    #new-tab {
      width: 30px;
      height: 30px;
      margin: 0 0 6px 5px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 13px;
    }
    #new-tab:hover {
      background: #202020;
      color: #fff;
    }
    form#idk {
      width: 100%;
      height: 48px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #111;
      border-bottom: 1px solid var(--border);
    }
    .nav-btn {
      width: 31px;
      height: 31px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 13px;
    }
    .nav-btn:hover {
      background: #222;
      color: #eee;
    }
    #back i {
      transform: translateX(-1px);
    }
    #forward i {
      transform: translateX(1px);
    }
    .address-bar {
      position: relative;
      flex: 1;
      height: 34px;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      height: 34px;
      padding: 0 42px 0 38px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 9px;
      outline: none;
      background: #1b1b1b;
      color: #eee;
      font-size: 13px;
    }
    .search-input:hover {
      background: #202020;
    }
    .search-input:focus {
      background: #202020;
      border-color: #444;
    }
    .search-input::placeholder {
      color: #666;
    }
    #site-status {
      position: absolute;
      left: 13px;
      z-index: 2;
      color: #777;
      font-size: 12px;
      pointer-events: none;
    }
    #site-status i {
      display: block;
    }
    #right-tools {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .toolbar-btn {
      width: 31px;
      height: 31px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #777;
      cursor: pointer;
    }
    .toolbar-btn:hover {
      background: #222;
      color: #eee;
    }
    #proxysel,
    #trans,
    #wispthingy {
      display: none;
    }
    #views {
      width: 100%;
      height: calc(100vh - 90px);
      background: #000;
      position: relative;
    }
    .view {
      width: 100%;
      height: 100%;
      display: none;
      border: 0;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
    }
    .view.active {
      display: block;
    }
    .new-tab-page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .new-tab-logo {
      width: 160px;
      margin-bottom: 40px;
      flex-shrink: 0;
    }
    .shortcuts {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px 22px;
      max-width: 600px;
      width: 100%;
    }
    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      padding: 4px;
      border-radius: 12px;
      transition: background .12s ease;
    }
    .shortcut:hover {
      background: rgba(255, 255, 255, .04);
    }
    .shortcut-icon {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, .06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #555;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }
    .shortcut:hover .shortcut-icon {
      background: #222;
      border-color: rgba(255, 255, 255, .12);
      color: #aaa;
    }
    .shortcut-icon i {
      font-size: 22px;
    }
    .shortcut-label {
      font-size: 11.5px;
      color: #999;
      text-align: center;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 400;
    }
    .shortcut:hover .shortcut-label {
      color: #ccc;
    }
    .internal-page {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow-y: auto;
      padding: 36px 24px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 5;
      display: none;
    }
    .internal-page.active {
      display: block;
    }
    .internal-container {
      max-width: 680px;
      margin: 0 auto;
    }
    .internal-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .internal-back {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .internal-back:hover {
      background: #1c1c1c;
      color: #eee;
    }
    .internal-title {
      font-size: 20px;
      font-weight: 500;
      color: #f0f0f0;
      letter-spacing: .2px;
    }
    .internal-section {
      margin-bottom: 26px;
      background: #101010;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .internal-section-title {
      padding: 14px 18px;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .7px;
      border-bottom: 1px solid var(--border);
      background: #0d0d0d;
    }
    .internal-row {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
    }
    .internal-row:last-child {
      border-bottom: none;
    }
    .internal-row-left {
      min-width: 0;
      flex: 1;
    }
    .internal-row-title {
      font-size: 13.5px;
      color: #e8e8e8;
      margin-bottom: 3px;
    }
    .internal-row-desc {
      font-size: 11.5px;
      color: #666;
      line-height: 1.4;
    }
    .internal-input {
      background: #161616;
      color: #eee;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 7px;
      padding: 9px 12px;
      outline: none;
      font-size: 12.5px;
      width: 260px;
      flex-shrink: 0;
      font-family: inherit;
    }
    .internal-input:focus {
      border-color: #3b82f6;
      background: #1a1a1a;
    }
    .internal-select {
      background: #161616;
      color: #eee;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 7px;
      padding: 9px 12px;
      outline: none;
      font-size: 12.5px;
      flex-shrink: 0;
      font-family: inherit;
      cursor: pointer;
    }
    .internal-select:focus {
      border-color: #3b82f6;
    }
    .internal-btn {
      background: #3b82f6;
      color: #fff;
      border: 0;
      border-radius: 7px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 12.5px;
      font-family: inherit;
      flex-shrink: 0;
    }
    .internal-btn:hover {
      background: #4a8ff7;
    }
    .internal-btn.secondary {
      background: #222;
      color: #ddd;
    }
    .internal-btn.secondary:hover {
      background: #2c2c2c;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px;
      max-width: 400px;
      width: 90%;
    }
    .modal h3 {
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      margin: 0 0 18px;
      text-align: center;
    }
    .modal label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      display: block;
      margin-bottom: 5px;
    }
    .modal input {
      width: 100%;
      background: #1d1d1d;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 7px;
      padding: 10px 12px;
      color: #eee;
      font-size: 13px;
      outline: none;
      margin-bottom: 16px;
      font-family: inherit;
    }
    .modal input:focus {
      border-color: #3b82f6;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .modal-actions button {
      border: 0;
      border-radius: 7px;
      padding: 9px 20px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }
    .btn-cancel {
      background: #252525;
      color: #eee;
    }
    .btn-cancel:hover {
      background: #2e2e2e;
    }
    .btn-save {
      background: #3b82f6;
      color: #fff;
    }
    .btn-save:hover {
      background: #4a8ff7;
    }
    @media (max-width: 600px) {
      .shortcuts {
        grid-template-columns: repeat(4, 1fr);
        gap: 12px 16px;
      }
      .shortcut-icon {
        width: 52px;
        height: 52px;
      }
      .internal-input {
        width: 160px;
      }
    }
    @media (max-width: 420px) {
      .shortcuts {
        grid-template-columns: repeat(3, 1fr);
      }
      .internal-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .internal-input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div id="tabs">
  <button id="new-tab" type="button" title="New tab">
    <i class="fa-solid fa-plus"></i>
  </button>
</div>

<form id="idk">
  <button type="button" id="back" class="nav-btn" aria-label="Back" title="Back">
    <i class="fa-solid fa-chevron-left"></i>
  </button>
  <button type="button" id="forward" class="nav-btn" aria-label="Forward" title="Forward">
    <i class="fa-solid fa-chevron-right"></i>
  </button>
  <button type="button" id="reload" class="nav-btn" aria-label="Reload" title="Reload">
    <i class="fa-solid fa-rotate-right"></i>
  </button>
  <div class="address-bar">
    <span id="site-status">
      <i class="fa-solid fa-globe"></i>
    </span>
    <input
      id="url"
      type="text"
      class="search-input"
      placeholder="Search or enter URL"
      autocomplete="off"
      spellcheck="false"
    >
  </div>
  <div id="right-tools">
    <button type="button" class="toolbar-btn" id="star" title="Bookmark">
      <i class="fa-regular fa-star"></i>
    </button>
    <button type="button" class="toolbar-btn" id="menu" title="Settings">
      <i class="fa-solid fa-gear"></i>
    </button>
  </div>
  <select id="wispthingy"></select>
</form>

<div id="views"></div>

<div class="modal-overlay" id="shortcut-modal">
  <div class="modal">
    <h3>Edit Shortcut</h3>
    <label for="sc-name">Name</label>
    <input id="sc-name" type="text" placeholder="e.g. YouTube">
    <label for="sc-url">URL</label>
    <input id="sc-url" type="text" placeholder="https://youtube.com">
    <label for="sc-icon">Icon (Font Awesome class)</label>
    <input id="sc-icon" type="text" placeholder="fa-solid fa-globe">
    <div class="modal-actions">
      <button class="btn-cancel" id="sc-cancel" type="button">Cancel</button>
      <button class="btn-save" id="sc-save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  var a1b2c = "wss://" + window.location.host + "/api/";
  var d3e4f = "https://www.google.com/search?q=%s";

  var j7k8l = "zaka13_wisp_server";
  var m9n0p = "zaka13_search_engine";
  var q1r2s = "https://unpkg.com/@zaka13/thing@1.0.0/logo-b2b3e4d75f89f6104a35c1c7a5972ddd1be2cf72.svg";

  var t3u4v = new Map();
  var w5x6y = null;
  var z7a8b = 0;

  var c9d0e = localStorage.getItem(j7k8l) || a1b2c;
  var f1g2h = localStorage.getItem(m9n0p) || d3e4f;

  var i3j4k = [];
  try {
    var l5m6n = localStorage.getItem(g5h6i);
    if (l5m6n) i3j4k = JSON.parse(l5m6n);
    else throw new Error();
  } catch (o7p8q) {
    i3j4k = [
      { name: "YouTube", url: "https://youtube.com", icon: "fa-solid fa-globe" },
      { name: "GitHub", url: "https://github.com", icon: "fa-solid fa-globe" },
      { name: "Discord", url: "https://discord.com", icon: "fa-solid fa-globe" },
      { name: "Twitter", url: "https://twitter.com", icon: "fa-solid fa-globe" },
      { name: "Reddit", url: "https://reddit.com", icon: "fa-solid fa-globe" },
      { name: "Spotify", url: "https://spotify.com", icon: "fa-solid fa-globe" },
      { name: "Netflix", url: "https://netflix.com", icon: "fa-solid fa-globe" },
      { name: "Twitch", url: "https://twitch.tv", icon: "fa-solid fa-globe" },

  }

  var r9s0t = document.getElementById("tabs");

    l7m8n.addEventListener('click', function() {

      y3z4a.appendChild(h9i0j);
    });

    m5n6o.appendChild(p7q8r);

    var k1l2m = document.createElement('div');
    k1l2m.className = 'internal-section';
    var n3o4p = document.createElement('div');
    n3o4p.className = 'internal-section-title';

    var q5r6s = document.createElement('div');
    q5r6s.className = 'internal-row';
