          <span class="yr">1952</span>
          <span class="est">Est.</span>
        </div>
      </div>
      <div class="about-text">
        <div class="section-label">Our Story</div>
        <h2 class="section-heading">A Legacy Built on Excellence</h2>
        <p>Founded in 1952, Riverside High School has spent over seven decades shaping the minds and characters of young people in Millbrook and the greater California community. What began as a modest campus of 300 students has grown into one of the state's most celebrated public high schools — without ever losing sight of what matters most: the individual student.</p>
        <p>We believe that a great education is not the delivery of information alone, but the cultivation of curiosity, resilience, and empathy. Every program, every extracurricular, every hallway conversation is designed with that belief at its core.</p>
        <p>Our alumni lead Fortune 500 companies, win Olympic medals, create art that moves nations, and serve their communities with quiet dignity. We are proud of every one of them — and of the students who will join their ranks.</p>
        <div class="signature-block">
          <div class="signature">Dr. Margaret Holloway</div>
          <div class="sig-title">Principal, Riverside High School</div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="academics">
  <div class="section-wrap">
    <div class="section-label">Academic Excellence</div>
    <h2 class="section-heading">Six Pillars of Learning</h2>
    <p class="section-sub">From Advanced Placement to the arts, our programs are designed to challenge every student and unlock their unique potential.</p>
    <div class="pillars-grid">
      <div class="pillar">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=600&q=80" alt="Humanities" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
        <div class="pillar-body">
          <div class="pillar-num">01 — Humanities</div>
          <h3>Classical Humanities</h3>
          <p>Students engage with the foundational texts of civilization, developing rhetoric, critical thinking, and the empathy required to lead in a complex world.</p>
        </div>
      </div>
      <div class="pillar">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600&q=80" alt="STEM" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
        <div class="pillar-body">
          <div class="pillar-num">02 — STEM</div>
          <h3>Science Engineering</h3>
          <p>State-of-the-art labs and a direct university partnership allow students to conduct college-level research from their sophomore year onward.</p>
        </div>
      </div>
      <div class="pillar">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&q=80" alt="Arts" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
        <div class="pillar-body">
          <div class="pillar-num">03 — Arts</div>
          <h3>Visual Performing Arts</h3>
          <p>Conservatory-style programs in music, theater, dance, and fine arts develop disciplined mastery and authentic creative expression.</p>
        </div>
      </div>
      <div class="pillar">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&q=80" alt="Technology" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
        <div class="pillar-body">
          <div class="pillar-num">04 — Technology</div>
          <h3>Computer Science AI</h3>
          <p>Our coding pathways — from web development to machine learning — prepare students for the digital economy of tomorrow.</p>
        </div>
      </div>
      <div class="pillar">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=600&q=80" alt="Languages" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
