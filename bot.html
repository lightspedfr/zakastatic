<!<DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bot Dashboard</title><style>body{margin:0;font-family:'Segoe UI',sans-serif;background:#23272a;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}.card{background:#2c2f33;padding:30px;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.3);width:100%;max-width:400px;text-align:center}.input{width:100%;padding:12px;margin:10px 0;border:1px solid #23272a;border-radius:4px;background:#202225;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;background:#5865F2;border:none;border-radius:4px;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}button:hover{background:#4752C4}.error{color:#f54242;margin-top:10px;font-size:14px;display:none}#dashboard{display:none;max-width:600px;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.stat{background:#23272a;padding:15px;border-radius:6px}</style></head><body><div id="login" class="card"><h2>Discord Bot Login</h2><input type="text" placeholder="Username" class="input"><input type="password" id="pw" placeholder="Password" class="input"><button onclick="login()">Login</button><div id="err" class="error">Password wrong</div></div><div id="dashboard" class="card"><h2>Bot Control Panel</h2><p>Status: <span style="color:#43b581">● Online</span></p><div class="grid"><div class="stat"><h3>5,231</h3><p>Total Servers</p></div><div class="stat"><h3>142,904</h3><p>Total Users</p></div></div><button onclick="alert('Bot restarting...')">Restart Bot</button><button onclick="location.reload()" style="background:#4f545c;margin-top:10px">Logout</button></div><script>function login(){var p=document.getElementById('pw').value;var e=document.getElementById('err');if(p!==''){e.style.display='block'}else{document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block'}}</script></body></html>
