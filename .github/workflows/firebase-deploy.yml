<section id="about">
  <div class="section-wrap">
    <div class="about-grid">
      <div class="about-img-wrap">
        <img referrerpolicy="no-referrer" decoding="async" loading="lazy" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=800&q=80" alt="Principal" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%271200%27 height=%27800%27 viewBox=%270 0 1200 800%27%3E%3Crect width=%271200%27 height=%27800%27 fill=%27%23e9eef5%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27middle%27 text-anchor=%27middle%27 fill=%27%236b7280%27 font-family=%27Arial,Helvetica,sans-serif%27 font-size=%2742%27%3Eimage unavailable%3C/text%3E%3C/svg%3E'">
